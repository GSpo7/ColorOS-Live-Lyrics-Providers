name: Build v5 Provider Matrix

# Builds every Provider APK and uploads them as workflow artifacts.
#  - push / pull_request: debug build (debug-signed, no secrets needed, works on forks)
#  - manual run: pick debug or release; release needs the signing secrets below
#
# Secrets (release only): SIGNING_KEY (base64 keystore), KEY_STORE_PASSWORD, ALIAS, KEY_PASSWORD
# Repository variable (optional): LYRICS_CONTACT_EMAIL - contact email put in the User-Agent that
# the Universal Provider sends to lrc.red (their API terms require one).

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      build-type:
        description: 'Build Type'
        type: choice
        options:
          - debug
          - release
        default: debug
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Provider APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Anything that is not an explicit manual "release" request builds debug.
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'debug' }}
      LYRICS_CONTACT_EMAIL: ${{ vars.LYRICS_CONTACT_EMAIL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android SDK licenses
        # compileSdk 37 is not preinstalled; AGP downloads it and needs accepted licenses.
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check release signing secrets
        if: ${{ env.BUILD_TYPE == 'release' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Release build requested but secret $name is not set. Add it under Settings > Secrets and variables > Actions, or run the workflow with build-type=debug." >&2
              exit 1
            fi
          done

      - name: Decode Keystore
        if: ${{ env.BUILD_TYPE == 'release' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: printf '%s' "$SIGNING_KEY" | base64 -d > release.jks

      - name: Run v5 Provider tests
        run: ./gradlew testV5Matrix --stacktrace

      - name: Build v5 Provider APKs
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew assembleV5MatrixRelease --build-cache --stacktrace
          else
            ./gradlew assembleV5MatrixDebug --build-cache --stacktrace
          fi
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify artwork contract mirror
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/verify-artwork-contract.ps1 -RepoRoot .

      - name: Build Dynamic Artwork Provider APK
        run: |
          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew :artwork-provider-am:assembleRelease --build-cache --stacktrace
          else
            ./gradlew :artwork-provider-am:assembleDebug --build-cache --stacktrace
          fi
        env:
          RELEASE_STORE_FILE: ../release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APKs to flat directory
        run: |
          mkdir -p collected-apks
          find . -name "*.apk" -path "*/build/outputs/apk/${BUILD_TYPE}/*" -exec cp {} collected-apks/ \;

          echo "Collected files:"
          ls -lh collected-apks/
          APK_COUNT=$(find collected-apks -maxdepth 1 -name "*.apk" | wc -l)
          # The artwork-provider-am APK shares this output path layout, so the collect step
          # sees 15 files since that module was added; keep the guard as a lower bound.
          if [ "$APK_COUNT" -lt 14 ]; then
            echo "::error::Expected at least 14 v5 Provider APKs, found $APK_COUNT" >&2
            exit 1
          fi

      - name: Create Provider bundle
        run: |
          mkdir -p bundled-apks
          (cd collected-apks && zip -qr "../bundled-apks/ColorOS-Live-Lyrics-Providers-${BUILD_TYPE}.zip" ./*.apk)
          echo "Bundled files:"
          ls -lh bundled-apks/

      # Plain (zipped) artifacts: upload-artifact only allows a single file with `archive: false`,
      # so a multi-APK glob must be archived.
      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_TYPE }}-apks
          path: collected-apks/*.apk
          if-no-files-found: error

      - name: Upload Provider bundle to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorOS-Live-Lyrics-Providers-${{ env.BUILD_TYPE }}-bundle
          path: bundled-apks/*.zip
          if-no-files-found: error

      - name: Cleanup
        if: always()
        run: |
          rm -f release.jks || true
          rm -rf collected-apks || true
          rm -rf bundled-apks || true
